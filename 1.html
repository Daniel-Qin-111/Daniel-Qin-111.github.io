<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0;
            padding:0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .header {
            background-color: #3dbede;
            display: flex;
            justify-content: center;
        }
        .container{
           width: 600px;
        }
        .header > .container{
            background-color: rgb(58, 58, 241);        
            height:40px
        }
        .footer{
           background-color: rgb(108, 110, 111);
           display: flex;
           justify-content: center;
        }
        .footer > .container{
            background-color: rgb(173, 203, 149);        
            height:40px
        }
        .main{
            display: flex;
            justify-content: center;
        }
        .main > .container{
            display: flex;
                gap: 10px;
        }
        .left{
            background-color: rgb(242, 140, 7);
            height: 300px;
            flex:auto;
            display: flex;
            gap: 10px;
        }
        .fx{
            background-color: rgb(234, 77, 34);
            height: 30px;
            flex:auto;
        }
        .right{
            width: 90px;
            display:flex;
            flex-direction: column;
            gap:10px
        }
        .item{
            background-color: rgb(233, 105, 105);
            height: 90px;
            margin: 90px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container"></div>
    </div>
    <div class="main">
        <div class="container">
            <div class="left"></div>
            <div class="right">
                <div class="item"></div>
                <div class="item"></div>
            </div>
        </div>
    </div>
    <div class="footer">
        <div class="container"></div>
    </div>
</body>
</html>
